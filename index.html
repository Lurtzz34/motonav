<!doctype html>
<html lang="tr" data-mode="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MotoNav">
<meta name="theme-color" content="#0f1216">
<title>MotoNav</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600;700&display=swap">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* Layout: full-screen map; idle = search at top; preview = bottom sheet; nav = maneuver card top + instrument bar bottom */
:root{
  --amber:#ffb000; --amber-ink:#1a1200;
  --route:#1e6bff; --danger:#e5484d; --ok:#1fa463; --toll:#a24bf0;
  --panel:#ffffff; --panel-2:#eef1f4; --ink:#0d1117; --muted:#5a6470; --line:#d6dbe1;
  --card:#10151b; --card-2:#1b222b; --card-ink:#ffffff; --card-muted:#9fabb8;
  --shadow:0 6px 24px rgba(10,15,25,.22);
  --f-num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-ui:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --gl:max(12px,var(--sl)); --gr:max(12px,var(--sr));
}
:root[data-mode="night"]{
  --panel:#141a21; --panel-2:#1e2630; --ink:#edf1f5; --muted:#98a3af; --line:#2a3440;
  --card:#090c10; --card-2:#151b22; --shadow:0 6px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0f1216;color:var(--ink);font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}
#map{position:fixed;inset:0}

body:not([data-ui="idle"]) .only-idle,
body:not([data-ui="preview"]) .only-preview,
body:not([data-ui="nav"]) .only-nav{display:none!important}

/* ---------- search (idle) */
#top{position:fixed;top:calc(var(--st) + 10px);left:var(--gl);right:var(--gr);z-index:5;display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto}
.searchbar{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:0 6px 0 16px;height:60px}
.searchbar svg{width:22px;height:22px;color:var(--muted);flex:none}
#q{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--ink);font:600 19px/1 var(--f-ui);outline:none;-webkit-user-select:text;user-select:text}
#q::placeholder{color:var(--muted);font-weight:500}
#q::-webkit-search-cancel-button{display:none}
.iconbtn{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn svg{width:24px;height:24px}
#results{list-style:none;margin:0;padding:6px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);max-height:55vh;overflow:auto}
#results li button{width:100%;text-align:left;padding:12px 12px;border-radius:12px;display:flex;flex-direction:column;gap:2px;min-height:56px}
#results li button:active{background:var(--panel-2)}
#results .r-name{font-weight:700;font-size:17px}
#results .r-sub{font-size:14px;color:var(--muted)}
#results .r-hint{padding:10px 12px;margin-bottom:4px;border-radius:12px;background:color-mix(in srgb,var(--amber) 22%,var(--panel));font-size:14px;line-height:1.4}
#results .r-kind{font-style:normal;font:700 11px var(--f-ui);letter-spacing:.05em;text-transform:uppercase;background:var(--panel-2);color:var(--muted);padding:2px 6px;border-radius:6px;margin-left:8px;vertical-align:2px}
#results .r-empty{padding:14px 12px;color:var(--muted)}
#chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--panel);box-shadow:var(--shadow);font-weight:600;font-size:16px;display:flex;align-items:center;gap:6px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.chip.fav{background:var(--amber);color:var(--amber-ink)}
.chip svg{width:16px;height:16px;flex:none}
#ver{position:fixed;left:var(--gl);bottom:calc(var(--sb) + 6px);z-index:4;font:600 11px var(--f-ui);color:#334;background:rgba(255,255,255,.7);padding:2px 6px;border-radius:6px}

/* ---------- floating buttons */
#fabs{position:fixed;right:var(--gr);z-index:6;display:flex;flex-direction:column;gap:10px}
body[data-ui="idle"] #fabs{top:calc(var(--st) + 84px)}
body[data-ui="preview"] #fabs{top:calc(var(--st) + 14px)}
body[data-ui="nav"] #fabs{bottom:calc(var(--sb) + 112px)}
.fab{width:56px;height:56px;border-radius:16px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
.fab.on{background:var(--route);color:#fff}
.fab{position:relative}
body:has(#results:not([hidden])) #fabs{display:none}
.fab .auto-tag{position:absolute;right:6px;bottom:4px;font:700 11px var(--f-ui);color:var(--muted)}
body[data-ui="idle"] #top + #fabs{}

/* ---------- preview sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.25);padding:14px var(--gr) calc(var(--sb) + 14px) var(--gl);display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.p-head{display:flex;align-items:flex-start;gap:8px}
.p-head > div{flex:1;min-width:0}
.eyebrow{font:700 12px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#p-name,#s-title{margin:2px 0 0;font:700 22px/1.2 var(--f-ui);text-wrap:balance;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.p-sum{font:700 30px/1 var(--f-num);font-variant-numeric:tabular-nums;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.p-sum small{font:500 15px var(--f-ui);color:var(--muted)}
.p-sum.msg{font:600 16px/1.35 var(--f-ui);color:var(--muted)}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.toggle{height:44px;padding:0 14px;border-radius:12px;background:var(--panel-2);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.toggle::before{content:"";width:18px;height:18px;border-radius:5px;border:2px solid var(--muted);flex:none}
.toggle[aria-pressed="true"]{background:color-mix(in srgb,var(--route) 16%,var(--panel))}
.toggle[aria-pressed="true"]::before{background:var(--route);border-color:var(--route);box-shadow:inset 0 0 0 3px var(--panel)}
.actions{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.primary{height:64px;border-radius:16px;background:var(--amber);color:var(--amber-ink);font:700 20px var(--f-ui)}
.primary:disabled{opacity:.45}
.secondary{height:64px;min-width:64px;padding:0 16px;border-radius:16px;background:var(--panel-2);font:700 16px var(--f-ui);display:grid;place-items:center}
.secondary svg{width:24px;height:24px}

/* ---------- navigation */
#nav-top{position:fixed;top:calc(var(--st) + 8px);left:var(--gl);right:var(--gr);z-index:5;max-width:640px;margin:0 auto}
.mcard{background:var(--card);color:var(--card-ink);border-radius:20px;padding:12px 16px 12px 12px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.micon{width:84px;height:84px;flex:none;border-radius:16px;background:var(--card-2);color:var(--amber);display:grid;place-items:center;position:relative}
.micon .ico{width:62px;height:62px;display:block;transition:transform .25s}
.micon .ico svg{width:100%;height:100%}
.micon .badge{position:absolute;right:6px;bottom:4px;font:700 20px var(--f-num);color:#fff}
.micon .badge:empty{display:none}
.mtext{flex:1;min-width:0}
.mdist{font:700 54px/0.95 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mstreet{font:600 19px/1.25 var(--f-ui);color:var(--card-muted);margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mnext{margin:6px 0 0 18px;display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--card-ink);border-radius:0 0 14px 14px;padding:6px 14px 8px;max-width:calc(100% - 36px)}
.mnext .lbl{font:700 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--card-muted)}
.micon.sm{width:30px;height:30px;border-radius:8px;background:transparent}
.micon.sm .ico{width:26px;height:26px}
.micon.sm .badge{font-size:12px;right:-2px;bottom:-4px}
#m-next-text{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#offroute{display:none;margin-top:6px;background:var(--danger);color:#fff;font-weight:700;padding:8px 14px;border-radius:12px;width:max-content}
#offroute.show{display:block}
#cam-alert{margin-top:6px;display:flex;align-items:center;gap:8px;background:var(--amber);color:var(--amber-ink);font-weight:700;padding:8px 14px;border-radius:12px;width:max-content;max-width:100%}
#cam-alert .cam-ico{width:22px;height:22px;flex:none}
#limit{position:fixed;left:var(--gl);bottom:calc(var(--sb) + 96px);z-index:5;width:68px;height:68px;border-radius:50%;background:#fff;border:7px solid #d42020;display:grid;place-items:center;box-shadow:var(--shadow)}
#limit span{font:700 28px/1 var(--f-num);color:#111;font-variant-numeric:tabular-nums}
#limit small{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font:700 11px var(--f-ui);letter-spacing:.04em;background:var(--card);color:#fff;padding:2px 6px;border-radius:6px}
#limit small:empty{display:none}
.park-pin{width:38px;height:44px;border-radius:10px 10px 10px 2px;background:#1e6bff;color:#fff;font:700 24px/44px var(--f-ui);text-align:center;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.4);padding:0}
.cam-row{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--amber-ink);background:color-mix(in srgb,var(--amber) 30%,var(--panel));padding:8px 12px;border-radius:12px}
:root[data-mode="night"] .cam-row{color:var(--ink)}
.set-h{margin-top:8px}
.set-group{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;background:var(--panel-2)}
.set-group .seg{background:var(--panel)}
.set-group .seg button{height:auto;min-height:44px;padding:6px 8px;line-height:1.2}
.set-group .seg button[aria-pressed="true"]{background:var(--route);color:#fff}
.set-group .r-t{font-weight:700;font-size:17px}
.set-group .r-s{font-size:14px;color:var(--muted)}
.primary.wide{grid-column:1 / -1;height:56px}
#limit.over{animation:pulse 1s ease-in-out infinite}
#spd.over{color:#ff5a5a}
@keyframes pulse{50%{transform:scale(1.12)}}
.cam-pin{width:30px;height:30px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.cam-pin svg{width:18px;height:18px}

#nav-bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);color:var(--card-ink);padding:10px var(--gr) calc(var(--sb) + 10px) var(--gl);display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;box-shadow:0 -6px 24px rgba(0,0,0,.35)}
.speed{display:flex;align-items:baseline;gap:4px;min-width:96px;padding:0 4px}
#spd{font:700 56px/1 var(--f-num);font-variant-numeric:tabular-nums}
.speed small{font:600 13px var(--f-ui);color:var(--card-muted)}
.trip{min-width:0}
.eta{font:700 30px/1 var(--f-num);font-variant-numeric:tabular-nums}
.remain{font:600 15px var(--f-ui);color:var(--card-muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btn-mute{width:60px;height:60px;border-radius:16px;background:var(--card-2);color:#fff}
#btn-mute.off{color:var(--danger)}
.stop{height:60px;padding:0 20px;border-radius:16px;background:var(--danger);color:#fff;font:700 18px var(--f-ui)}
#demo-tag{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 92px);z-index:5;background:var(--amber);color:var(--amber-ink);font:700 13px var(--f-ui);letter-spacing:.08em;padding:4px 10px;border-radius:8px}

/* ---------- marker */
.me{width:44px;height:44px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.me svg{width:100%;height:100%}

/* ---------- toast / update */
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 120px);z-index:20;background:#111;color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow);font-size:15px;line-height:1.35}
#update{position:fixed;left:var(--gl);right:var(--gr);bottom:calc(var(--sb) + 12px);z-index:21;max-width:520px;margin:0 auto;background:var(--amber);color:var(--amber-ink);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;box-shadow:var(--shadow)}
#update button{height:44px;padding:0 18px;border-radius:12px;background:var(--amber-ink);color:var(--amber);font-weight:700}
body[data-ui="nav"] #update{bottom:calc(var(--sb) + 100px)}

.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{transition:bottom .2s}
body[data-ui="nav"] .maplibregl-ctrl-bottom-right{bottom:calc(var(--sb) + 86px)}
body[data-ui="preview"] .maplibregl-ctrl-bottom-right{display:none}
/* ---------- v1.6: menu, fuel, maintenance, stops */
body[data-ui="nav"] .not-nav{display:none!important}
input{-webkit-user-select:text;user-select:text}
.add-stop{height:44px;border-radius:12px;border:2px dashed var(--line);color:var(--muted);font-weight:700;font-size:15px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu-tile{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:14px;border-radius:16px;background:var(--panel-2);min-height:86px}
.menu-tile b{font:700 18px var(--f-ui)}
.menu-tile span{font-size:13px;color:var(--muted);font-weight:600;line-height:1.3}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.f-label{font-size:13px;color:var(--muted);font-weight:600}
.f-box{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:0 10px;height:48px}
.f-box:focus-within{border-color:var(--route)}
.f-box input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:700 20px var(--f-num);outline:none}
.f-unit{color:var(--muted);font-weight:600;font-size:14px}
.field-row{display:flex;gap:8px}
.gauge{height:12px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--ok);border-radius:6px}
.gauge.low i{background:var(--danger)}
.row.maint{border-left:6px solid var(--line)}
.row.maint.ok{border-left-color:var(--ok)}
.row.maint.soon{border-left-color:var(--amber)}
.row.maint.late{border-left-color:var(--danger)}
.row.maint .act{padding:0 14px}
.sheet-search{box-shadow:none;background:var(--panel-2);height:54px;padding-left:14px}
.sheet-search input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--ink);font:600 18px var(--f-ui);outline:none}
.stop-results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.stop-results li button{width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--panel-2);display:flex;flex-direction:column;gap:2px;min-height:54px}
.stop-results .r-name{font-weight:700;font-size:16px}
.stop-results .r-sub{font-size:13px;color:var(--muted)}
.stop-results .r-kind{font-style:normal;font:700 11px var(--f-ui);text-transform:uppercase;color:var(--muted);margin-left:8px}
.stop-results .r-hint,.stop-results .r-empty{padding:10px 12px;font-size:14px;color:var(--muted)}
.chips-inline{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips-inline .chip{box-shadow:none;background:var(--panel-2)}
.chips-inline .chip.fav{background:var(--amber)}
.fuel-head{background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
#fuel-badge{position:fixed;left:calc(var(--gl) + 80px);bottom:calc(var(--sb) + 112px);z-index:5;background:var(--card);color:#fff;font:700 15px var(--f-ui);padding:8px 12px;border-radius:12px;box-shadow:var(--shadow)}
#fuel-badge.low{background:var(--danger)}

/* ---------- v1.1: route style, alternatives, stops, list sheet */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel-2);padding:4px;border-radius:14px}
.seg button{height:44px;border-radius:10px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
#p-alts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
#p-alts::-webkit-scrollbar{display:none}
.alt{flex:none;min-height:54px;padding:6px 14px;border-radius:12px;border:2px solid var(--line);text-align:left;display:flex;flex-direction:column;justify-content:center;gap:3px}
.alt b{font:700 22px/1 var(--f-num);font-variant-numeric:tabular-nums}
.alt span{font-size:13px;color:var(--muted);font-weight:600}
.alt[aria-pressed="true"]{border-color:var(--route);background:color-mix(in srgb,var(--route) 10%,var(--panel))}
#p-stops{display:flex;flex-direction:column;gap:6px}
.stop-row{display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:12px;padding:4px 4px 4px 12px;font-weight:600}
.stop-row .dot{width:12px;height:12px;border-radius:50%;background:var(--amber);flex:none}
.stop-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop-row .iconbtn{width:40px;height:40px}
.toggle:disabled{opacity:.5}
#sheet2{z-index:8;max-height:74vh;gap:10px}
.s-body{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:14px;background:var(--panel-2);text-align:left;width:100%;min-height:62px}
.row .r-main{flex:1;min-width:0}
.row .r-t{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r-s{font-size:14px;color:var(--muted);margin-top:2px}
.row .act{flex:none;height:48px;padding:0 18px;border-radius:12px;background:var(--amber);color:var(--amber-ink);font-weight:700}
.tag{display:inline-block;font:700 11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;background:var(--ok);color:#fff;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--panel-2);border-radius:14px;padding:12px}
.stat b{display:block;font:700 32px/1 var(--f-num);font-variant-numeric:tabular-nums}
.stat b small{font:600 15px var(--f-ui);color:var(--muted)}
.stat span{display:block;margin-top:4px;font-size:13px;color:var(--muted);font-weight:600}
.switch{flex:none;width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
[aria-checked="true"] > .switch{background:var(--ok)}
[aria-checked="true"] > .switch::after{transform:translateX(20px)}
.s-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.s-actions .wide{grid-column:1 / -1}
.toll-row{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;border-radius:12px;background:color-mix(in srgb,var(--toll) 12%,var(--panel));text-align:left;font-weight:600;font-size:15px}
.toll-row .toll-sw{width:22px;height:6px;border-radius:3px;background:var(--toll);flex:none}
.toll-row span{flex:1;min-width:0}
.toll-row b{font:700 22px/1 var(--f-num);font-variant-numeric:tabular-nums}
.toll-row em{font-style:normal;font-size:13px;color:var(--muted)}
.toll-row.free{background:var(--panel-2);color:var(--muted)}
.toll-row.free .toll-sw{background:var(--ok)}
.row .fee{flex:none;font:700 22px/1 var(--f-num);font-variant-numeric:tabular-nums;padding-right:4px}
.row.total{background:transparent;border-top:2px solid var(--line);border-radius:0;min-height:52px}
.s-msg{color:var(--muted);padding:6px 2px;margin:0;line-height:1.45}
@media (prefers-reduced-motion:reduce){.micon .ico{transition:none}#limit.over{animation:none}}
@media (min-width:700px){.mdist{font-size:64px}}
</style>

<script>
'use strict';
const VERSION = '1.7.0';

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('mn_'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('mn_'+k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const settings = Object.assign({avoidHighways:false, avoidTolls:false, muted:false, mode:null, routeStyle:'main'}, store.get('settings', {}));
settings.routeStyle = ({fast:'main', short:'side'})[settings.routeStyle] || settings.routeStyle || 'main';
const saveSettings = () => store.set('settings', settings);

function fetchT(url, ms = 12000){
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  return fetch(url, {signal:c.signal}).finally(() => clearTimeout(t));
}
const D2R = Math.PI/180, R2D = 180/Math.PI;
function hav(a, b){
  const dLat=(b.lat-a.lat)*D2R, dLon=(b.lon-a.lon)*D2R;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*D2R)*Math.cos(b.lat*D2R)*Math.sin(dLon/2)**2;
  return 2*6371000*Math.asin(Math.sqrt(x));
}
function brg(a, b){
  const y=Math.sin((b.lon-a.lon)*D2R)*Math.cos(b.lat*D2R);
  const x=Math.cos(a.lat*D2R)*Math.sin(b.lat*D2R)-Math.sin(a.lat*D2R)*Math.cos(b.lat*D2R)*Math.cos((b.lon-a.lon)*D2R);
  return (Math.atan2(y,x)*R2D+360)%360;
}
function decodePolyline(str, prec){
  let i=0, lat=0, lon=0; const f=Math.pow(10,prec), out=[];
  while(i<str.length){
    let b, s=0, r=0;
    do{ b=str.charCodeAt(i++)-63; r|=(b&31)<<s; s+=5; }while(b>=32);
    lat += (r&1) ? ~(r>>1) : (r>>1);
    s=0; r=0;
    do{ b=str.charCodeAt(i++)-63; r|=(b&31)<<s; s+=5; }while(b>=32);
    lon += (r&1) ? ~(r>>1) : (r>>1);
    out.push([lon/f, lat/f]);
  }
  return out;
}
const lcTR = s => s ? s.charAt(0).toLocaleLowerCase('tr') + s.slice(1) : '';
function fmtDist(m){
  if(m < 1000) return (m < 100 ? Math.max(0, Math.round(m/10)*10) : Math.round(m/50)*50) + ' m';
  return (m/1000).toFixed(m < 10000 ? 1 : 0).replace('.', ',') + ' km';
}
function spokenDist(m){
  if(m < 1000) return Math.max(50, Math.round(m/50)*50) + ' metre';
  const k = Math.round(m/500)/2;
  return (k % 1 ? Math.floor(k) + ' buçuk' : k) + ' kilometre';
}
function fmtTime(s){
  const min = Math.max(1, Math.round(s/60));
  if(min < 60) return min + ' dk';
  return Math.floor(min/60) + ' sa ' + String(min%60).padStart(2,'0') + ' dk';
}
const clock = d => d.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
let toastTimer;
function toast(msg, ms = 3500){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, ms);
}
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://overpass.private.coffee/api/interpreter'];
async function overpass(q, ms = 25000){
  let last;
  for(const u of OVERPASS){
    const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
    try{
      const r = await fetch(u, {method:'POST', body:'data=' + encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}, signal:c.signal});
      if(r.ok) return await r.json();
      last = new Error('HTTP ' + r.status);
    }catch(e){ last = e; }
    finally{ clearTimeout(t); }
  }
  throw last;
}
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ================= icons ================= */
const ICON = {
  arrow:'<svg viewBox="0 0 48 48"><path d="M24 3 41 22H30v23H18V22H7z" fill="currentColor"/></svg>',
  flag:'<svg viewBox="0 0 48 48"><path d="M11 45V5h4v2h23l-5 8.5L38 24H15v21z" fill="currentColor"/></svg>',
  round:'<svg viewBox="0 0 48 48"><circle cx="24" cy="29" r="9.5" fill="none" stroke="currentColor" stroke-width="5"/><path d="M24 2l10 11h-7v8h-6v-8h-7z" fill="currentColor"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg>',
  sound:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3"/><circle cx="9.5" cy="12" r="2.2"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>'
};
// Valhalla maneuver type -> arrow rotation (degrees)
const ROT = {1:0,2:45,3:-45,7:0,8:0,9:40,10:90,11:135,12:180,13:180,14:-135,15:-90,16:-40,17:0,18:35,19:-35,20:40,21:-40,22:0,23:25,24:-25,25:0,37:30,38:-30};
const DEST_TYPES = [4,5,6];
function setIcon(el, m){
  const ico = el.querySelector('.ico'), badge = el.querySelector('.badge');
  badge.textContent = '';
  if(DEST_TYPES.includes(m.type)){ ico.innerHTML = ICON.flag; ico.style.transform = ''; }
  else if(m.type === 26 || m.type === 27){ ico.innerHTML = ICON.round; ico.style.transform = ''; if(m.exitCount) badge.textContent = m.exitCount; }
  else { ico.innerHTML = ICON.arrow; ico.style.transform = 'rotate(' + (ROT[m.type] ?? 0) + 'deg)'; }
}

/* ================= state ================= */
let map, userMarker = null, destMarker = null;
let pos = null, headingAnchor = null, lastFix = null;
let follow = true, centeredOnce = false;
let route = null, dest = null, stops = [], routes = [], selRoute = 0, stopMarkers = [], rec = null;
let via = [], gpxShown = null; // GPX: points the route must pass through (no stop announcements)
const routePoints = d => [...stops, ...via.map(v => ({lat:v.lat, lon:v.lon, through:true})), d];
let navigating = false, navState = null, demoTimer = null, watchId = null;
let wakeLock = null, routeReq = 0;
const posWaiters = [];

/* ================= map ================= */
const STYLES = {
  day:'https://tiles.openfreemap.org/styles/liberty',
  night:'https://tiles.openfreemap.org/styles/fiord'
};
function currentMode(){
  if(settings.mode) return settings.mode;
  const h = new Date().getHours();
  return (h >= 19 || h < 7) ? 'night' : 'day';
}
let mode = currentMode();
document.documentElement.dataset.mode = mode;

map = new maplibregl.Map({
  container:'map', style:STYLES[mode], center:[28.97, 41.02], zoom:11,
  attributionControl:{compact:true}, pitchWithRotate:true, dragRotate:true
});
map.touchZoomRotate.enableRotation();

map.on('style.load', () => {
  if(!map.getSource('route')){
    const empty = {type:'FeatureCollection', features:[]};
    map.addSource('track', {type:'geojson', data:empty});
    map.addLayer({id:'track-line', type:'line', source:'track',
      layout:{'line-join':'round','line-cap':'round'},
      paint:{'line-color':'#ffb000','line-width':['interpolate',['linear'],['zoom'],8,3,14,6,18,12]}});
    map.addSource('gpx', {type:'geojson', data:empty});
    map.addLayer({id:'gpx-line', type:'line', source:'gpx',
      layout:{'line-join':'round','line-cap':'round'},
      paint:{'line-color':'#ffb000','line-width':['interpolate',['linear'],['zoom'],8,3,14,6,18,10],'line-dasharray':[1.5,1.5],'line-opacity':.9}});
    map.addSource('route-alt', {type:'geojson', data:empty});
    map.addLayer({id:'route-alt-line', type:'line', source:'route-alt',
      layout:{'line-join':'round','line-cap':'round'},
      paint:{'line-color':mode === 'night' ? '#5b6878' : '#8f9bab','line-width':['interpolate',['linear'],['zoom'],8,4,14,8,18,16],'line-opacity':.9}});
    map.addSource('route', {type:'geojson', data:{type:'FeatureCollection', features:[]}});
    map.addLayer({id:'route-casing', type:'line', source:'route',
      layout:{'line-join':'round','line-cap':'round'},
      paint:{'line-color':'#ffffff','line-width':['interpolate',['linear'],['zoom'],8,5,14,11,18,24]}});
    map.addSource('route-toll', {type:'geojson', data:{type:'FeatureCollection', features:[]}});
    map.addLayer({id:'route-line', type:'line', source:'route',
      layout:{'line-join':'round','line-cap':'round'},
      paint:{'line-color':mode === 'night' ? '#4d8dff' : '#1e6bff','line-width':['interpolate',['linear'],['zoom'],8,3,14,7,18,16]}});
    map.addLayer({id:'route-toll-line', type:'line', source:'route-toll',
      layout:{'line-join':'round','line-cap':'round'},
      paint:{'line-color':'#a24bf0','line-width':['interpolate',['linear'],['zoom'],8,3,14,7,18,16]}});
  }
  drawRoute();
});

function drawRoute(){
  const src = map.getSource && map.getSource('route');
  if(!src) return;
  const from = navigating && navState && navState.along > 5 ? navState.along : 0;
  const coords = route ? (from ? sliceCoords(route, from, route.total) : route.coords) : null;
  src.setData(coords && coords.length > 1 ? {type:'Feature', geometry:{type:'LineString', coordinates:coords}} : {type:'FeatureCollection', features:[]});
  const alts = navigating ? [] : routes.map((r, i) => ({type:'Feature', properties:{i}, geometry:{type:'LineString', coordinates:r.coords}})).filter(f => f.properties.i !== selRoute);
  map.getSource('route-alt').setData({type:'FeatureCollection', features:alts});
  map.getSource('route-toll').setData({type:'FeatureCollection', features:tollFeatures(route, from)});
  if(trackPts) map.getSource('track').setData({type:'Feature', geometry:{type:'LineString', coordinates:trackPts}});
  map.getSource('gpx').setData(gpxShown && gpxShown.length > 1 ? {type:'Feature', geometry:{type:'LineString', coordinates:gpxShown}} : {type:'FeatureCollection', features:[]});
}
let trackPts = null;
function showTrack(pts){
  trackPts = pts.map(p => [p[0], p[1]]);
  drawRoute();
  if(trackPts.length < 2) return;
  const b = new maplibregl.LngLatBounds(); trackPts.forEach(c => b.extend(c));
  const h = $('#sheet2').getBoundingClientRect().height || 300;
  map.fitBounds(b, {padding:{top:60, bottom:h + 30, left:40, right:80}, bearing:0, pitch:0, duration:700, maxZoom:16});
}
function clearTrack(){
  trackPts = null;
  const t = map.getSource && map.getSource('track');
  if(t) t.setData({type:'FeatureCollection', features:[]});
}

const stopFollow = e => { if(e && e.originalEvent){ follow = false; updateCenterBtn(); } };
map.on('dragstart', stopFollow);
map.on('rotatestart', stopFollow);
map.on('pitchstart', stopFollow);

map.on('click', e => {
  if(navigating) return;
  const ui = document.body.dataset.ui;
  if(ui === 'preview'){
    const box = [[e.point.x-14, e.point.y-14], [e.point.x+14, e.point.y+14]];
    const hit = map.getLayer('route-alt-line') ? map.queryRenderedFeatures(box, {layers:['route-alt-line']}) : [];
    if(hit.length) selectRoute(hit[0].properties.i);
    return;
  }
  if(!$('#sheet2').hidden) return;
  if(ui === 'idle' && !$('#results').hidden){ $('#results').hidden = true; $('#q').blur(); return; }
  const d = {name:'İşaretlenen nokta', lat:e.lngLat.lat, lon:e.lngLat.lng, picked:true};
  chooseDestination(d);
  reverseName(d);
});

async function reverseName(d){
  try{
    const r = await fetchT(`https://photon.komoot.io/reverse?lon=${d.lon}&lat=${d.lat}&limit=1`, 6000);
    const j = await r.json(); const p = j.features && j.features[0] && j.features[0].properties;
    if(!p) return;
    const name = p.name || [p.street, p.housenumber].filter(Boolean).join(' ') || p.district || p.city;
    if(name && dest === d){ d.name = name; d.picked = false; $('#p-name').textContent = name; pushRecent(d); }
  }catch(e){}
}

/* ================= theme ================= */
function renderModeBtn(){
  const b = $('#btn-mode');
  b.innerHTML = (mode === 'night' ? ICON.moon : ICON.sun) + (settings.mode ? '' : '<b class="auto-tag">A</b>');
  b.setAttribute('aria-label', 'Harita teması: ' + (settings.mode ? (mode === 'night' ? 'Gece' : 'Gündüz') : 'Otomatik'));
}
function applyMode(){
  const m = currentMode();
  if(m === mode) return;
  mode = m; document.documentElement.dataset.mode = mode;
  map.setStyle(STYLES[mode], {diff:false});
}
$('#btn-mode').onclick = () => {
  // Otomatik -> Gündüz -> Gece -> Otomatik
  settings.mode = settings.mode == null ? 'day' : settings.mode === 'day' ? 'night' : null;
  saveSettings(); applyMode(); renderModeBtn();

/* ---------- heading: GPS course when moving, compass when slow, movement as last resort */
let compass = null; // {h, t}
function screenAngle(){
  const a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
  return ((a % 360) + 360) % 360;
}
function onOrient(e){
  let h = null;
  if(typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) h = e.webkitCompassHeading;
  else if(e.absolute && typeof e.alpha === 'number') h = 360 - e.alpha;
  if(h == null) return;
  h = (h + screenAngle()) % 360;
  compass = {h, t:Date.now()};
  if(pos && pos.speed < 4){ pos.heading = h; onHeadingChange(h); }
}
let compassOn = false;
function enableCompass(){
  if(compassOn) return;
  const add = () => { compassOn = true; window.addEventListener('deviceorientationabsolute', onOrient); window.addEventListener('deviceorientation', onOrient); };
  try{
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(s => { if(s === 'granted') add(); }).catch(() => {});
    } else add();
  }catch(e){}
}
let lastRot = 0;
function onHeadingChange(h){
  if(userMarker) userMarker.setRotation(h);
  if(!navigating || !follow || settings.view === 'north') return;
  const now = Date.now();
  if(now - lastRot < 250) return;
  const diff = Math.abs(((h - map.getBearing() + 540) % 360) - 180);
  if(diff < 4) return;
  lastRot = now;
  map.rotateTo(h, {duration:240, easing:t => t});
}

/* ---------- smooth marker movement between GPS fixes */
let markerAnim = null;
function moveMarker(to){
  if(!userMarker) return;
  const from = userMarker.getLngLat ? userMarker.getLngLat() : null;
  if(!from || hav({lat:from.lat, lon:from.lng}, to) > 150){ userMarker.setLngLat([to.lon, to.lat]); return; }
  cancelAnimationFrame(markerAnim);
  const t0 = performance.now(), dur = 850;
  const step = now => {
    const k = Math.min(1, (now - t0)/dur);
    userMarker.setLngLat([from.lng + (to.lon - from.lng)*k, from.lat + (to.lat - from.lat)*k]);
    if(k < 1) markerAnim = requestAnimationFrame(step);
  };
  markerAnim = requestAnimationFrame(step);
}

function handlePosition(f){
  // speed fallback
  if(lastFix && (f.speed == null || isNaN(f.speed) || f.speed < 0)){
    const dt = (f.t - lastFix.t)/1000;
    f.speed = dt > 0 ? hav(lastFix, f)/dt : 0;
  }
  if(f.speed == null || isNaN(f.speed) || f.speed < 0) f.speed = 0;
  const gpsOk = f.heading != null && !isNaN(f.heading) && f.heading >= 0;
  f.gpsHeading = gpsOk && f.speed >= 3;
  if(f.gpsHeading){ headingAnchor = f; }
  else if(compass && Date.now() - compass.t < 2000){ f.heading = compass.h; }
  else if(headingAnchor && hav(headingAnchor, f) > 4){ f.heading = brg(headingAnchor, f); headingAnchor = f; }
  else { f.heading = gpsOk ? f.heading : (pos ? pos.heading : 0); if(!headingAnchor) headingAnchor = f; }
  lastFix = f; pos = f;

  if(!userMarker){
    userMarker = new maplibregl.Marker({element:meEl, rotationAlignment:'map', pitchAlignment:'map'}).setLngLat([f.lon, f.lat]).addTo(map);
  } else if(navigating) moveMarker(f);
  else userMarker.setLngLat([f.lon, f.lat]);
  userMarker.setRotation(f.heading);

  while(posWaiters.length) posWaiters.shift()(f);

  if(!centeredOnce && !dest){ centeredOnce = true; map.jumpTo({center:[f.lon, f.lat], zoom:15}); }
  $('#spd').textContent = Math.round(f.speed*3.6);
  if(navigating && route) updateNav(f);
  if(navigating && rec && !demoTimer) recPoint(f);
  if(navigating) camera(f);
  else if(document.body.dataset.ui === 'idle') loadNearCams(f);
}

function waitPos(ms = 15000){
  if(pos) return Promise.resolve(pos);
  return new Promise(res => { posWaiters.push(res); setTimeout(() => res(pos), ms); });
}

// Search asks two geocoders at once, merges them and ranks: exact name match first, then places near you.
const TR_FOLD = {'ç':'c','ğ':'g','ı':'i','i̇':'i','ö':'o','ş':'s','ü':'u','â':'a','î':'i','û':'u'};
const fold = s => (s || '').toLocaleLowerCase('tr').replace(/[çğıöşüâîû]|i̇/g, c => TR_FOLD[c] || c).replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const PLACE_KIND = {
  mall:'AVM', shopping_centre:'AVM', department_store:'Mağaza', supermarket:'Market', fuel:'Benzinlik', hospital:'Hastane', clinic:'Klinik',
  pharmacy:'Eczane', school:'Okul', university:'Üniversite', college:'Okul', restaurant:'Restoran', cafe:'Kafe', fast_food:'Restoran',
  parking:'Otopark', motorcycle_parking:'Motosiklet parkı', bank:'Banka', mosque:'Cami', place_of_worship:'İbadethane', hotel:'Otel',
  stadium:'Stadyum', park:'Park', attraction:'Gezilecek yer', museum:'Müze', station:'İstasyon', bus_station:'Otogar', aerodrome:'Havalimanı',
  ferry_terminal:'İskele', motorcycle:'Motosiklet bayi', car_repair:'Servis', industrial:'Sanayi', townhall:'Belediye', police:'Polis',
  city:'Şehir', town:'İlçe', village:'Köy', suburb:'Mahalle', neighbourhood:'Mahalle', quarter:'Mahalle', district:'İlçe', county:'İlçe',
  primary:'Cadde', secondary:'Cadde', tertiary:'Cadde', trunk:'Yol', motorway:'Otoyol', residential:'Sokak', unclassified:'Yol', street:'Cadde',
  house:'Adres', building:'Bina', commercial:'Ticari alan', retail:'Ticari alan'
};
const POI_KEYS = ['amenity', 'shop', 'tourism', 'leisure', 'office', 'healthcare', 'railway', 'aeroway', 'public_transport', 'historic', 'craft', 'building', 'landuse'];
function scoreHit(h, q){
  const fq = fold(q), fn = fold(h.name), toks = fq.split(' ').filter(Boolean);
  let s = 0;
  if(fn === fq) s += 60;
  else if(fn.startsWith(fq)) s += 35;
  const hit = toks.filter(t => fn.includes(t)).length;
  s += toks.length ? (hit / toks.length) * 40 : 0;
  if(hit === toks.length) s += 15;
  if(h.poi) s += 12;
  if(h.kind === 'Şehir' || h.kind === 'İlçe') s += 4;
  const ref = pos || {lat:41.02, lon:28.97};
  const km = hav(ref, h) / 1000;
  s -= Math.min(35, 10 * Math.log10(1 + km));
  return s;
}
async function searchPhoton(q){
  const bias = pos ? `&lat=${pos.lat}&lon=${pos.lon}` : '&lat=41.02&lon=28.97';
  const r = await fetchT(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=10${bias}&location_bias_scale=0.3`, 8000);
  if(!r.ok) throw new Error('photon');
  const j = await r.json();
  return (j.features || []).map(ft => {
    const p = ft.properties || {};
    const street = [p.street, p.housenumber].filter(Boolean).join(' ');
    const name = p.name || street || p.district || p.city || 'Adsız yer';
    const sub = [p.name ? street : '', p.district, p.city || p.county, p.state].filter(Boolean)
      .filter((v, i, a) => a.indexOf(v) === i && v !== name).join(', ');
    return {name, sub, lat:ft.geometry.coordinates[1], lon:ft.geometry.coordinates[0],
      kind:PLACE_KIND[p.osm_value] || PLACE_KIND[p.type] || '', poi:POI_KEYS.includes(p.osm_key) && !!p.name, src:'p'};
  });
}
async function searchNominatim(q){
  const vb = pos ? `&viewbox=${pos.lon-0.6},${pos.lat+0.45},${pos.lon+0.6},${pos.lat-0.45}` : '&viewbox=28.3,41.4,29.6,40.8';
  const r = await fetchT(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&countrycodes=tr&accept-language=tr${vb}&q=${encodeURIComponent(q)}`, 8000);
  if(!r.ok) throw new Error('nominatim');
  const n = await r.json();
  return n.map(x => {
    const parts = x.display_name.split(',').map(t => t.trim());
    return {name:x.name || parts[0], sub:parts.slice(1, 4).join(', '), lat:+x.lat, lon:+x.lon,
      kind:PLACE_KIND[x.type] || PLACE_KIND[x.addresstype] || '', poi:POI_KEYS.includes(x.category) && !!x.name, src:'n'};
  });
}
// Map links pasted from Apple Maps, Google Maps or OpenStreetMap: take the coordinates straight from the link.
function parseMapLink(text){
  const t = text.trim();
  if(!/^(https?:\/\/|maps\.|www\.)/i.test(t) && !/maps\.apple|google\.[a-z.]+\/maps|goo\.gl|openstreetmap/i.test(t)) return null;
  let url; try{ url = new URL(/^https?:/i.test(t) ? t : 'https://' + t); }catch(e){ return null; }
  if(/(^|\.)goo\.gl$/i.test(url.hostname)) return {short:true};
  const P = url.searchParams, num = '(-?\\d{1,3}\\.\\d+)';
  const pair = v => { const m = (v || '').match(new RegExp('^\\s*' + num + '\\s*,\\s*' + num)); return m ? {lat:+m[1], lon:+m[2]} : null; };
  let c = pair(P.get('coordinate')) || pair(P.get('ll')) || pair(P.get('q')) || pair(P.get('destination')) || pair(P.get('query')) || pair(P.get('daddr')) || pair(P.get('sll'));
  if(!c && P.get('mlat')) c = {lat:+P.get('mlat'), lon:+P.get('mlon')};
  if(!c){ const m = url.href.match(new RegExp('@' + num + ',' + num)); if(m) c = {lat:+m[1], lon:+m[2]}; }
  if(!c){ const m = url.href.match(new RegExp('!3d' + num + '!4d' + num)); if(m) c = {lat:+m[1], lon:+m[2]}; }
  if(!c || Math.abs(c.lat) > 90 || Math.abs(c.lon) > 180) return {bad:true};
  let name = P.get('name') || P.get('q') || '';
  if(!name){ const m = url.pathname.match(/\/place\/([^/@]+)/); if(m) name = decodeURIComponent(m[1].replace(/\+/g, ' ')); }
  if(!name || pair(name)) name = (P.get('address') || '').split(',')[0] || 'Paylaşılan konum';
  return {name, sub:P.get('address') || 'Harita linkinden', lat:c.lat, lon:c.lon, kind:'Link'};
}
async function geocode(q){
  const m = q.match(/^\s*(-?\d{1,2}(?:\.\d+)?)\s*[,; ]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
  if(m) return {list:[{name:'Koordinat', sub:q, lat:+m[1], lon:+m[2]}]};
  const link = parseMapLink(q);
  if(link){
    if(link.short) return {list:[], hint:'Kısa Google linkleri açılamıyor. Apple Haritalar\'da yeri bulup Paylaş › Kopyala ile linki yapıştır ya da Google Haritalar\'da yere basılı tutup koordinatı kopyala.'};
    if(link.bad) return {list:[], hint:'Bu linkte konum bilgisi bulunamadı.'};
    return {list:[link]};
  }
  const [a, b] = await Promise.allSettled([searchPhoton(q), searchNominatim(q)]);
  if(a.status === 'rejected' && b.status === 'rejected') return {list:null};
  const all = [...(a.value || []), ...(b.value || [])];
  all.forEach(h => h.score = scoreHit(h, q));
  all.sort((x, y) => y.score - x.score);
  const out = [];
  all.forEach(h => {
    const dup = out.find(o => hav(o, h) < 150 && (fold(o.name) === fold(h.name) || o.kind === h.kind));
    if(dup){ if(!dup.kind && h.kind) dup.kind = h.kind; if(!dup.sub && h.sub) dup.sub = h.sub; return; }
    out.push(h);
  });
  const toks = fold(q).split(' ').filter(Boolean);
  const exact = out.some(h => toks.every(t => fold(h.name).includes(t)) || toks.filter(t => fold(h.name).includes(t)).length >= Math.max(1, toks.length - 1) && h.poi);
  return {list:out.slice(0, 8), hint:exact ? null : 'Aradığın yer bu haritada kayıtlı olmayabilir. Apple Haritalar\'da bulup Paylaş › Kopyala ile linki buraya yapıştırabilirsin. Haritada noktaya dokunarak da hedef seçebilirsin.'};
}

/* ================= routing ================= */
// Ana yollar: main roads, few turns, no residential shortcuts (default)
// Ara sokaklar: smaller streets and more direct lines are fine
// Virajlı: away from motorways and main roads
// No live traffic is used: a motorcycle passes queues, so the route is never bent around a jam.
function costingOptions(costing){
  if(costing === 'pedestrian') return {};
  const st = settings.routeStyle || 'main';
  const hw = (settings.avoidHighways || st === 'curvy') ? 0 : st === 'side' ? 0.3 : 1;
  const o = {use_tolls:settings.avoidTolls ? 0 : 0.5, use_highways:hw, use_tracks:0, use_ferry:0.3};
  if(st === 'main'){ o.use_living_streets = 0; o.service_penalty = 90; o.maneuver_penalty = 30; o.gate_penalty = 600; }
  if(st === 'side'){ o.use_living_streets = 0.7; o.service_penalty = 10; o.maneuver_penalty = 2; }
  if(st === 'curvy'){ o.use_living_streets = 0.1; o.maneuver_penalty = 10; }
  if(costing === 'motorcycle'){ o.use_trails = 0; o.use_primary = st === 'main' ? 1 : st === 'side' ? 0.2 : 0.1; }
  if(costing === 'motor_scooter'){ o.top_speed = 45; o.use_primary = st === 'main' ? 0.8 : 0.15; delete o.use_highways; }
  return o;
}
// pts = [stop1, ..., destination]; returns an array of routes (first = recommended)
async function fetchRoutes(from, pts, alternates = 0){
  const walk = pts.length && pts[pts.length-1].walk;
  const primary = walk ? 'pedestrian' : vclass() === 'L1' ? 'motor_scooter' : 'motorcycle';
  try{ return await valhallaRoutes(from, pts, primary, alternates); }
  catch(e1){
    if(walk) throw e1;
    console.warn('valhalla ' + primary, e1);
    try{ return await valhallaRoutes(from, pts, 'auto', alternates); }
    catch(e2){ console.warn('valhalla auto', e2); return await osrmRoutes(from, pts, alternates); }
  }
}
async function valhallaRoutes(from, pts, costing, alternates){
  const loc0 = {lat:from.lat, lon:from.lon};
  if(from.heading != null && from.speed > 2){ loc0.heading = Math.round(from.heading); loc0.heading_tolerance = 50; }
  const body = {locations:[loc0, ...pts.map((p, k) => p.through && k < pts.length - 1 ? {lat:p.lat, lon:p.lon, type:'through'} : {lat:p.lat, lon:p.lon})], costing,
    costing_options:{[costing]:costingOptions(costing)}, directions_options:{language:'tr-TR', units:'kilometers'}, units:'kilometers'};
  if(alternates && pts.length === 1) body.alternates = alternates;
  const r = await fetchT('https://valhalla1.openstreetmap.de/route?json=' + encodeURIComponent(JSON.stringify(body)), 15000);

/* ================= speed limits (motorcycle rules) ================= */
function encodePolyline6(pts){
  let out = '', pl = 0, pn = 0;
  const enc = v => { v = v < 0 ? ~(v << 1) : v << 1; let s = ''; while(v >= 0x20){ s += String.fromCharCode((0x20 | (v & 0x1f)) + 63); v >>= 5; } return s + String.fromCharCode(v + 63); };
  for(const [lon, lat] of pts){ const a = Math.round(lat*1e6), b = Math.round(lon*1e6); out += enc(a - pl) + enc(b - pn); pl = a; pn = b; }
  return out;
}
// Karayolları Trafik Yönetmeliği Md. 100 (km/sa): şehir içi / şehir dışı çift yönlü / bölünmüş yol / otoyol
const MOTO_RULES = {
  L3:{name:'Motosiklet', sub:'L3 · 50 cc üstü', urban:50, twoWay:80, divided:90, motorway:100},
  L1:{name:'Motorlu bisiklet', sub:'L1 · 50 cc ve altı', urban:30, twoWay:45, divided:45, motorway:null}
};
const ROAD_LABEL = {urban:'şehir içi', twoWay:'çift yönlü yol', divided:'bölünmüş yol', motorway:'otoyol'};
const vclass = () => MOTO_RULES[settings.vclass] ? settings.vclass : 'L3';
function roadType(s){
  if(s.rc === 'motorway') return 'motorway';
  if(s.rc === 'residential' || s.rc === 'service_other' || (s.density != null && s.density >= 8)) return 'urban';
  if(s.oneway && (s.rc === 'trunk' || s.rc === 'primary' || s.rc === 'secondary')) return 'divided';
  return 'twoWay';
}
// Posted sign wins in town (commissions may raise town limits for all vehicles);
// outside town a higher sign meant for cars is capped at the motorcycle limit for that road type.
function motoLimit(s){
  const R = MOTO_RULES[vclass()], t = roadType(s), legal = R[t];
  if(legal == null) return {lim:null, banned:true, t};
  let lim = legal, src = 'genel';
  if(s.posted){
    if(t === 'urban' && vclass() === 'L3'){ lim = s.posted; src = 'levha'; }
    else if(s.posted <= legal){ lim = s.posted; src = 'levha'; }
    else { lim = legal; src = 'motosiklet'; }
  }
  return {lim, src, t};
}
const LIMIT_CHUNK = 250;
let limitBusy = false;
async function ensureLimits(R, i){
  if(!R || limitBusy) return;
  R.limitChunks = R.limitChunks || [];
  const need = [i, Math.min(R.coords.length - 1, i + 60)];
  if(R.limitChunks.some(c => c.i0 <= need[0] && c.i1 >= need[1])) return;
  if(R.limitFails > 3) return;
  const i0 = Math.max(0, i - 2), i1 = Math.min(R.coords.length - 1, i0 + LIMIT_CHUNK);
  if(i1 - i0 < 1) return;
  limitBusy = true;
  try{
    const body = {encoded_polyline:encodePolyline6(R.coords.slice(i0, i1 + 1)), costing:'auto', shape_match:'map_snap',
      filters:{attributes:['edge.speed_limit', 'edge.road_class', 'edge.density', 'edge.traversability', 'edge.begin_shape_index', 'edge.end_shape_index'], action:'include'}};
    const r = await fetchT('https://valhalla1.openstreetmap.de/trace_attributes?json=' + encodeURIComponent(JSON.stringify(body)), 12000);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const segs = (j.edges || []).map(e => ({a:i0 + (e.begin_shape_index || 0), b:i0 + (e.end_shape_index || 0),
      posted:typeof e.speed_limit === 'number' && e.speed_limit >= 5 && e.speed_limit <= 150 ? e.speed_limit : null,
      rc:e.road_class || '', density:typeof e.density === 'number' ? e.density : null,
      oneway:e.traversability === 'forward' || e.traversability === 'backward'}));
    R.limitChunks.push({i0, i1, segs});
  }catch(e){
    R.limitFails = (R.limitFails || 0) + 1;
    R.limitChunks.push({i0, i1:Math.min(i1, i0 + 40), segs:[]});
  }finally{ limitBusy = false; }
}
function segAt(R, i){
  if(!R || !R.limitChunks) return null;
  for(let k = R.limitChunks.length - 1; k >= 0; k--){
    const c = R.limitChunks[k];
    if(i < c.i0 || i > c.i1) continue;
    const s = c.segs.find(s => i >= s.a && i < Math.max(s.b, s.a + 1));
    if(s) return s;
  }
  return null;
}
let overSince = 0, lastOverWarn = 0, bannedWarned = null;
function updateLimit(f, i){
  ensureLimits(route, i);
  const sign = $('#limit'), seg = segAt(route, i), kmh = f.speed*3.6;
  const L = seg ? motoLimit(seg) : null;
  if(L && L.banned){
    sign.hidden = true;
    if(bannedWarned !== route){ bannedWarned = route; speak('Dikkat, motorlu bisikletler otoyola giremez'); toast('Motorlu bisikletler otoyola giremez.', 5000); }
    return;
  }
  if(!L || !L.lim || settings.limitShow === false){ sign.hidden = true; $('#spd').classList.remove('over'); overSince = 0; return; }
  sign.hidden = false; $('#limit-v').textContent = L.lim;
  $('#limit-src').textContent = L.src === 'levha' ? 'levha' : L.src === 'motosiklet' ? 'motosiklet' : ROAD_LABEL[L.t];
  const tol = settings.tol ?? 10;
  const over = kmh > L.lim * (1 + tol/100) + 1;
  $('#spd').classList.toggle('over', over); sign.classList.toggle('over', over);
  if(!over){ overSince = 0; return; }
  if(!overSince) overSince = Date.now();
  if(settings.speedWarn !== false && Date.now() - overSince > 3000 && Date.now() - lastOverWarn > 60000){
    lastOverWarn = Date.now(); speak('Hız sınırı ' + L.lim);
  }
}

/* ================= radars (speed cameras) ================= */
let cams = [], nearCams = [], camMarkers = [], camSeq = 0, nearAt = null;
function camQuery(around){ return `[out:json][timeout:25];(node["highway"="speed_camera"](${around});node["enforcement"="maxspeed"](${around}););out;`; }
function parseCam(el){ const ms = parseInt((el.tags && el.tags.maxspeed) || '', 10); return {lat:el.lat, lon:el.lon, max:isNaN(ms) ? null : ms}; }
function refreshCamMarkers(){
  camMarkers.forEach(m => m.remove()); camMarkers = [];
  if(settings.camShow === false) return;
  const list = document.body.dataset.ui === 'idle' ? nearCams : cams.filter(c => !c.passed);
  list.forEach(c => {
    const el = document.createElement('button'); el.className = 'cam-pin'; el.innerHTML = ICON.cam;
    el.setAttribute('aria-label', 'Radar');
    el.onclick = ev => { ev.stopPropagation(); toast('Radar (hız kamerası)' + (c.max ? ' · sınır ' + c.max + ' km/sa' : ''), 2500); };
    camMarkers.push(new maplibregl.Marker({element:el}).setLngLat([c.lon, c.lat]).addTo(map));
  });
}
async function loadCameras(R){
  const seq = ++camSeq;
  cams = []; refreshCamMarkers(); renderCamInfo();
  if(!R || (settings.camShow === false && settings.camWarn === false)) return;
  const pts = []; let next = 0;
  const maxAlong = Math.min(R.total, 250000);
  for(let i = 0; i < R.coords.length && R.cum[i] <= maxAlong; i++){
    if(R.cum[i] >= next){ pts.push(R.coords[i][1].toFixed(5) + ',' + R.coords[i][0].toFixed(5)); next = R.cum[i] + 400; }
  }
  if(pts.length < 2) return;
  try{
    const j = await overpass(camQuery('around:80,' + pts.join(',')), 25000);
    if(seq !== camSeq || route !== R) return;
    const seen = new Set();
    cams = (j.elements || []).map(el => {
      const c = parseCam(el), pr = projectOnRoute(R, c, 0);
      return Object.assign(c, {along:pr.along, off:pr.off, warned:false});
    }).filter(c => { const k = c.lat.toFixed(4) + c.lon.toFixed(4); if(c.off >= 60 || seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => a.along - b.along);
    refreshCamMarkers(); renderCamInfo();
  }catch(e){}
}
async function loadNearCams(f){
  if(settings.camShow === false || document.body.dataset.ui !== 'idle') return;
  if(nearAt && hav(nearAt, f) < 2000 && Date.now() - nearAt.t < 10*60*1000) return;
  nearAt = {lat:f.lat, lon:f.lon, t:Date.now()};
  try{
    const j = await overpass(camQuery(`around:6000,${f.lat.toFixed(5)},${f.lon.toFixed(5)}`), 20000);
    nearCams = (j.elements || []).map(parseCam);
    if(document.body.dataset.ui === 'idle') refreshCamMarkers();
  }catch(e){ nearAt = null; }
}
function renderCamInfo(){
  const el = $('#p-cams');
  if(!el) return;
  if(document.body.dataset.ui !== 'preview' || !cams.length || settings.camShow === false){ el.hidden = true; return; }
  el.hidden = false; el.textContent = 'Rotada ' + cams.length + ' radar var';
}
function updateCameras(along, f){
  const box = $('#cam-alert');
  let changed = false;
  cams.forEach(c => { if(!c.passed && c.along < along - 30){ c.passed = true; changed = true; } });
  if(changed) refreshCamMarkers();
  const c = cams.find(c => !c.passed);
  if(!c || settings.camWarn === false){ box.hidden = true; return; }
  const d = c.along - along, warnAt = Math.max(400, f.speed*20);
  if(d <= warnAt){
    box.hidden = false;
    $('#cam-text').textContent = 'Radar · ' + fmtDist(Math.max(0, d)) + (c.max ? ' · sınır ' + c.max : '');
    if(!c.warned){ c.warned = true; speak(spokenDist(d) + ' sonra radar' + (c.max ? ', hız sınırı ' + c.max : '')); }
  } else box.hidden = true;
}
function onRouteChanged(){
  overSince = 0; $('#limit').hidden = true; $('#spd').classList.remove('over');
  loadCameras(route);
}
function clearSafety(){
  camSeq++; cams = []; refreshCamMarkers();
  $('#limit').hidden = true; $('#cam-alert').hidden = true; $('#spd').classList.remove('over');
}

/* ================= odometer ================= */
// km ridden with MotoNav (from recorded rides) + offset so it matches the bike's own odometer
function odoCfg(){ return Object.assign({km:0, offset:null}, store.get('odo', {})); }
function rideKm(){ return odoCfg().km + (rec ? rec.dist/1000 : 0); }           // km recorded by the app
function bikeKm(){ const o = odoCfg(); return o.offset == null ? null : rideKm() + o.offset; } // bike's odometer, if set
function addOdo(km){ const o = odoCfg(); o.km = Math.round((o.km + km)*100)/100; store.set('odo', o); }
const fmtKm = v => Math.round(v).toLocaleString('tr-TR') + ' km';
const fmtNum = (v, d = 1) => (Math.round(v*Math.pow(10, d))/Math.pow(10, d)).toLocaleString('tr-TR', {maximumFractionDigits:d});

/* ================= fuel ================= */
// Defaults are rough values for a 150 cc scooter; the rider edits them in Yakıt.
function fuelCfg(){ return Object.assign({tank:7, cons:3.0, reserveKm:30, level:null, lastAt:0, price:null, log:[]}, store.get('fuel', {})); }
function saveFuel(F){ store.set('fuel', F); }
function fuelInfo(){
  const F = fuelCfg(); if(F.level == null) return null;
  const left = Math.max(0, F.level - (rideKm() - F.lastAt) * F.cons/100);
  return {left, pct:Math.min(1, left/F.tank), range:F.cons > 0 ? left/F.cons*100 : 0, F};
}
function realConsumption(F){
  // full-to-full: litres put in after the first full fill / km between full fills
  const log = (F.log || []).slice().sort((a, b) => a.t - b.t);
  const fulls = log.map((e, i) => e.full ? i : -1).filter(i => i >= 0);
  if(fulls.length < 2) return null;
  const a = fulls[0], b = fulls[fulls.length - 1];
  const km = log[b].odo - log[a].odo; if(km < 50) return null;
  const litres = log.slice(a + 1, b + 1).reduce((s, e) => s + (e.liters || 0), 0);
  return litres > 0 ? litres/km*100 : null;
}
function addFuelEntry(liters, cost, full){
  const F = fuelCfg(), info = fuelInfo(), now = rideKm();
  const before = info ? info.left : 0;
  F.level = full ? F.tank : Math.min(F.tank, before + (liters || 0));
  F.lastAt = now;
  if(liters > 0 && cost > 0) F.price = cost/liters;
  F.log = [{t:Date.now(), liters:liters || null, cost:cost || null, full:!!full, odo:now}, ...(F.log || [])].slice(0, 200);
  saveFuel(F); renderFuelBadge();
}
function renderFuelBadge(){
  const el = $('#fuel-badge'); if(!el) return;
  const i = fuelInfo();
  if(!i || !navigating || (dest && dest.walk)){ el.hidden = true; return; }
  el.hidden = false;
  el.textContent = 'Menzil ' + Math.max(0, Math.round(i.range)) + ' km';
  el.classList.toggle('low', i.range <= i.F.reserveKm);
}
let fuelWarned = {};
function checkFuelOnStart(){
  fuelWarned = {};
  const i = fuelInfo(); if(!i || !route) return;
  const need = route.total/1000;
  if(i.range < need + i.F.reserveKm/2){
    setTimeout(() => {
      speak('Dikkat, yakıt bu rota için yetmeyebilir');
      toast(`Menzil ${Math.round(i.range)} km, rota ${Math.round(need)} km. Pompa düğmesinden rota üzerindeki benzinliği durak ekleyebilirsin.`, 8000);
    }, 2500);
  }
}
function checkFuelDuring(){
  const i = fuelInfo(); if(!i) return;
  renderFuelBadge();
  const r = i.range, res = i.F.reserveKm;
  if(r <= res && !fuelWarned.res){ fuelWarned.res = true; speak('Yakıt azaldı, menzil ' + Math.max(0, Math.round(r)) + ' kilometre'); }
  if(r <= 10 && !fuelWarned.crit){ fuelWarned.crit = true; speak('Yakıt kritik seviyede, en yakın benzinliğe gidin'); }
}
function numberField(label, value, step, unit, onChange){
  const wrap = mk('label', 'field');
  wrap.append(mk('span', 'f-label', label));
  const box = mk('span', 'f-box');
  const inp = document.createElement('input');
  inp.type = 'number'; inp.inputMode = 'decimal'; inp.step = step; inp.min = '0';
  if(value != null) inp.value = value;
  inp.onchange = () => { const v = parseFloat(String(inp.value).replace(',', '.')); if(!isNaN(v) && v >= 0) onChange(v); };
  box.append(inp); if(unit) box.append(mk('span', 'f-unit', unit));
  wrap.append(box);
  return {wrap, inp};
}

  const save = mk('button', 'secondary', 'Kaydet');

    addFuelEntry(L > 0 ? L : null, C > 0 ? C : null, isFull); toast('Yakıt kaydedildi', 2000); openFuelStatus();
  };
  form.append(chk, save); b.append(form);
  // settings
  const cfg = mk('div', 'set-group'); cfg.append(mk('div', 'r-t', 'Motor bilgileri'), mk('div', 'r-s', 'Kendi motoruna göre düzenle'));
  const r2 = mk('div', 'field-row');
  r2.append(numberField('Depo hacmi', F.tank, '0.1', 'L', v => { const G = fuelCfg(); G.tank = v; if(G.level != null) G.level = Math.min(G.level, v); saveFuel(G); }).wrap,
            numberField('Tüketim', F.cons, '0.1', 'L/100', v => { const G = fuelCfg(); G.cons = v; saveFuel(G); }).wrap);
  cfg.append(r2, numberField('Uyarı menzili', F.reserveKm, '1', 'km', v => { const G = fuelCfg(); G.reserveKm = v; saveFuel(G); }).wrap);

  if((F.log || []).length){
    b.append(mk('div', 'eyebrow set-h', 'Son yakıt kayıtları'));

      const r = mk('div', 'row'), m = mk('div', 'r-main');

/* ================= GPX routes ================= */
function parseGpx(text){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('GPX okunamadı');
  const get = sel => [...doc.getElementsByTagName(sel)].map(n => [+n.getAttribute('lon'), +n.getAttribute('lat')]).filter(p => !isNaN(p[0]) && !isNaN(p[1]));
  let pts = get('trkpt'); if(pts.length < 2) pts = get('rtept'); if(pts.length < 2) pts = get('wpt');
  if(pts.length < 2) throw new Error('Dosyada rota noktası yok');
  const nameEl = doc.querySelector('trk > name, rte > name, metadata > name, name');
  return {name:(nameEl && nameEl.textContent.trim()) || 'GPX rota', pts};
}
function simplifyByDistance(pts, minGap){
  const out = [pts[0]]; let last = pts[0];
  for(let i = 1; i < pts.length - 1; i++){
    if(hav({lat:last[1], lon:last[0]}, {lat:pts[i][1], lon:pts[i][0]}) >= minGap){ out.push(pts[i]); last = pts[i]; }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
function trackLength(pts){ let d = 0; for(let i = 1; i < pts.length; i++) d += hav({lat:pts[i-1][1], lon:pts[i-1][0]}, {lat:pts[i][1], lon:pts[i][0]}); return d; }
function saveGpx(g){
  let gap = 15, pts = g.pts;
  while(pts.length > 1500){ gap *= 2; pts = simplifyByDistance(g.pts, gap); }
  const item = {id:Date.now(), name:g.name, pts:pts.map(p => [+p[0].toFixed(5), +p[1].toFixed(5)]), dist:Math.round(trackLength(pts))};
  const list = [item, ...store.get('gpx', [])].slice(0, 15);
  while(list.length && !store.set('gpx', list)) list.pop();
  return item;
}
function gpxVia(g){
  // up to 14 evenly spaced points (by distance) for the router to pass through
  const total = g.dist || trackLength(g.pts), n = Math.min(14, Math.max(1, Math.floor(total/3000)));
  const out = []; let acc = 0, next = total/(n + 1);
  for(let i = 1; i < g.pts.length - 1 && out.length < n; i++){
    acc += hav({lat:g.pts[i-1][1], lon:g.pts[i-1][0]}, {lat:g.pts[i][1], lon:g.pts[i][0]});
    if(acc >= next){ out.push({lat:g.pts[i][1], lon:g.pts[i][0]}); next += total/(n + 1); }
  }
  return out;
}
function startGpx(g, fromNearest){
  let pts = g.pts;
  if(fromNearest && pos){
    let best = 0, bd = Infinity;
    pts.forEach((p, i) => { const d = hav(pos, {lat:p[1], lon:p[0]}); if(d < bd){ bd = d; best = i; } });
    pts = pts.slice(best);
  }
  if(pts.length < 2){ toast('Rotanın sonuna çok yakınsın.'); return; }
  const part = {pts, dist:trackLength(pts)};
  const start = {lat:pts[0][1], lon:pts[0][0]}, end = pts[pts.length - 1];
  const v = [start, ...gpxVia(part)];
  chooseDestination({name:g.name, lat:end[1], lon:end[0]}, {via:v, gpx:pts});
}
function openGpx(){
  openSheet('GPX', 'GPX rotalarım');
  const b = $('#s-body');
  const input = document.createElement('input'); input.type = 'file'; input.accept = '.gpx,application/gpx+xml,application/xml,text/xml,application/octet-stream'; input.hidden = true;
  input.onchange = async () => {
    const f = input.files && input.files[0]; if(!f) return;

  if(!list.length) b.append(mk('p', 's-msg', 'Paylaşılan tur rotalarını (.gpx) Dosyalar uygulamasından seçip yükleyebilirsin. Rota boyunca sesli yönlendirme yapılır, kesik turuncu çizgi orijinal rotayı gösterir.'));
  list.forEach(g => {

    m.append(mk('div', 'r-t', g.name), mk('div', 'r-s', fmtDist(g.dist) + (near != null ? ' · rotaya ' + fmtDist(near) : '')));
    const go = mk('button', 'act', 'Başla'); go.onclick = () => startGpx(g, false);

    more.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';

    row.append(m, more, go); b.append(row);

function addStop(d){
  const st = {name:d.name, lat:d.lat, lon:d.lon};

    // insert where it fits best along the current route
    const pr = route ? projectOnRoute(route, st, 0) : null;
    const idx = stops.findIndex(s => route && projectOnRoute(route, s, 0).along > (pr ? pr.along : 0));
    if(idx < 0) stops.push(st); else stops.splice(idx, 0, st);
    renderStops();

  } else if(dest){
    stops.push(st); renderStops(); computePreview();

async function shareOrDownload(file){
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:file.name}); return; } }
  catch(e){ if(e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
}
const BACKUP_SKIP = ['facGeom', 'hintShown', 'maintToast', 'recLive'];
function backupData(){
  const data = {};
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k.startsWith('mn_')) continue;
      const key = k.slice(3); if(BACKUP_SKIP.includes(key)) continue;
      data[key] = JSON.parse(localStorage.getItem(k));
    }
  }catch(e){}
  return data;
}

  openSheet('Yedekleme', 'Yedekle ve geri yükle');

      cancel.onclick = openBackup;
      const a2 = mk('div', 's-actions'); a2.append(ok, cancel); b.append(a2);
    }catch(e){ toast('Yedek okunamadı: ' + e.message, 5000); }
  };
  acts.append(exp, imp); b.append(input, acts);
  b.append(mk('p', 's-msg', 'Yedek dosyasını Dosyalar\'a, iCloud Drive\'a ya da kendine mesaj olarak kaydedebilirsin. Telefon değiştirince ya da Safari verileri silinince bu dosyayla geri yükleyebilirsin. Ayda bir yedek almanı öneririm.'));

function newNavState(){ return {seg:0, next:1, ann:{}, off:0, lastReroute:0, rerouting:false, onRoute:false, startT:Date.now()}; }
function startNav(demo){
  if(!route) return;

  routes = [route]; selRoute = 0; drawRoute(); closeSheet();

function updateNav(f){
  const R = route, S = navState; if(!R || !S) return;
  const pr = projectOnRoute(R, f, S.seg);
  S.seg = pr.i;

  // off-route detection: distance from the line plus heading mismatch (catches side roads quickly)
  const acc = Math.min(f.acc || 10, 50);
  const tol = Math.max(20, Math.min(45, acc + 12));
  const pa = R.coords[pr.i], pb = R.coords[Math.min(pr.i + 1, R.coords.length - 1)];
  const segBrg = brg({lat:pa[1], lon:pa[0]}, {lat:pb[1], lon:pb[0]});
  const hdgDiff = Math.abs(((f.heading - segBrg + 540) % 360) - 180);
  const wrongWay = f.gpsHeading && pr.off > 12 && hdgDiff > 50;
  if(pr.off <= tol) S.onRoute = true;
  const usable = (f.acc || 0) <= 60;
  const bad = usable && (pr.off > tol || wrongWay);
  S.off = bad ? S.off + 1 : (usable ? 0 : S.off);
  const now = Date.now();
  const offAtStart = !S.onRoute && pr.off > 150 && now - S.startT > 20000;
  if(!S.rerouting && now - S.lastReroute > 5000 && ((S.onRoute && (S.off >= 2 || (bad && pr.off > tol * 2.5))) || offAtStart)){ reroute(f); }

  const along = pr.along;
  S.along = along;
  if(!S.lastDraw || Date.now() - S.lastDraw > 900){ S.lastDraw = Date.now(); drawRoute(); }
  let n = Math.max(1, S.next);
  while(n < R.mans.length - 1 && R.cum[R.mans[n].idx] <= along + 10){
    const pm = R.mans[n];
    if(pm.stop && !pm.passed){ pm.passed = true; if(!(S.ann[n] && S.ann[n].near)) speak(pm.pre); if(stops.length) stops.shift(); renderStops(); }
    n++;
  }
  S.next = n;
  const man = R.mans[n] || R.mans[R.mans.length-1];
  const dist = Math.max(0, R.cum[man.idx] - along);
  const remain = Math.max(0, R.total - along);

  if(dest && !dest.walk){ updateLimit(f, pr.i); updateCameras(along, f); if(!demoTimer) checkFuelDuring(); }

  // maneuver card
  $('#m-dist').textContent = fmtDist(dist);
  $('#m-text').textContent = man.text;
  setIcon($('#m-icon'), man);
  const after = R.mans[n+1];
  if(after && !(DEST_TYPES.includes(man.type) && !man.stop)){
    $('#m-next').hidden = false; setIcon($('#m-next-icon'), after);
    $('#m-next-text').textContent = after.street || after.text;
  } else $('#m-next').hidden = true;

  // trip info
  const remTime = R.total ? R.time * (remain / R.total) : 0;
  $('#eta').textContent = clock(new Date(Date.now() + remTime*1000));
  $('#remain').textContent = fmtDist(remain) + ' · ' + fmtTime(remTime);

  // voice
  const v = Math.max(f.speed, 5);
  const far = Math.max(450, v*24), near = man.stop ? 30 : Math.max(120, v*8);
  const a = S.ann[n] || (S.ann[n] = {});
  if(!a.far && dist <= far && dist > near + 80){ a.far = true; speak(spokenDist(dist) + ' sonra, ' + lcTR(man.alert)); }
  if(!a.near && dist <= near){ a.near = a.far = true; speak(man.pre); }

  if(remain < 25 || (n === R.mans.length - 1 && DEST_TYPES.includes(man.type) && dist < 20)) arrive();
}
let lastRerouteSpeech = 0, lastRerouteFail = 0;
async function reroute(f, msg){
  const S = navState; if(!S) return;
  S.rerouting = true; S.lastReroute = Date.now(); S.off = 0;
  $('#offroute').classList.add('show');
  if(msg || Date.now() - lastRerouteSpeech > 20000){ lastRerouteSpeech = Date.now(); speak(msg || 'Rota yeniden hesaplanıyor'); }
  try{
    if(via.length && route) via = via.filter(v => projectOnRoute(route, v, 0).along > (navState ? navState.along || 0 : 0) - 50);
    const target = dest;
    if(!target) return;
    const r = (await fetchRoutes(f, routePoints(target), 0))[0];
    if(!navigating || dest !== target) return;
    r.tolls = target.walk ? null : estimateTolls(r);
    route = r; drawRoute(); navState = newNavState(); navState.lastReroute = Date.now(); navState.onRoute = true;
    onRouteChanged();
  }catch(e){
    if(Date.now() - lastRerouteFail > 30000){ lastRerouteFail = Date.now(); toast(navigator.onLine === false ? 'İnternet yok. Bağlantı gelince rota yenilenecek.' : 'Yeni rota alınamadı, tekrar denenecek.'); }
  }
  finally{ if(navState) navState.rerouting = false; $('#offroute').classList.remove('show'); }
}
function arrive(){
  if(!navigating) return;
  speak('Hedefinize ulaştınız');
  toast('Hedefe ulaştın.');
  navigating = false;
  setTimeout(stopNav, 1200);
}

/* ================= demo ride ================= */
function startDemo(){
  let along = 0, R = route; const v = 50/3.6;
  if(demoTimer) clearInterval(demoTimer);
  const tick = () => {
    if(!navigating || !route){ clearInterval(demoTimer); demoTimer = null; return; }
    if(route !== R){ R = route; along = 0; }
    along += v;
    const p = pointAt(route, along), q = pointAt(route, along + 12);
    handlePosition({lat:p.lat, lon:p.lon, acc:5, speed:v, heading:brg(p, q), t:Date.now()});
  };
  demoTimer = setInterval(tick, 1000);
  tick();
}

/* ================= service worker / updates ================= */
$('#ver').textContent = 'MotoNav v' + VERSION;
function showUpdate(w){
  $('#update').hidden = false;
  $('#update-btn').onclick = () => { if(navigating){ toast('Sürüş bitince güncelle.'); return; } w.postMessage('skipWaiting'); };
}
if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').then(reg => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') check(); });
    setInterval(check, 20*60*1000);
    if(reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w && w.addEventListener('statechange', () => { if(w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w); });
    });
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(reloading) return; reloading = true; location.reload(); });
}

/* ================= boot ================= */
syncToggles(); renderChips(); startGPS(); enableCompass();
document.querySelector('#cam-alert .cam-ico').innerHTML = ICON.cam;
renderPark(); tripStats(); recoverRide(); maintReminder();
setTimeout(() => loadFacilities(), 2500);
if(!window.matchMedia('(display-mode: standalone)').matches && /iPhone|iPad/.test(navigator.userAgent) && !store.get('hintShown', false)){
  store.set('hintShown', true);
  setTimeout(() => toast('Uygulama gibi kullanmak için: Paylaş › Ana Ekrana Ekle', 7000), 1500);
}
const WHATS_NEW = 'Yeni: rotalar varsayılan olarak ana yollardan (Ara sokaklar ayrı seçenek), Osmangazi ve 1915 köprüleri artık algılanıyor, köprü ücretleri Ayarlar\'dan düzenlenebilir.';
const seenVersion = store.get('seenVersion', null);
if(seenVersion && seenVersion !== VERSION) setTimeout(() => toast('MotoNav ' + VERSION + ' — ' + WHATS_NEW, 9000), 1200);
store.set('seenVersion', VERSION);
</script>
